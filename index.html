<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:,">
  <title>Perseverance · Jezero Crater</title>
  <style>html,body{margin:0;height:100%;overflow:hidden;background:#c8956a}canvas{display:block}
    #hud{position:fixed;left:16px;bottom:16px;padding:8px 12px;border-radius:8px;background:rgba(40,18,8,.45);color:#ffe2c4;font:13px/1.4 system-ui,sans-serif;pointer-events:none;letter-spacing:.02em}
    #hud b{color:#fff}
    #sky-map{position:fixed;top:16px;left:16px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
    #skymap{width:220px;height:220px;border-radius:50%;box-shadow:0 0 0 2px rgba(200,220,255,.35),0 4px 18px rgba(0,0,0,.45)}
    #sky-info{max-width:260px;padding:4px 10px;border-radius:8px;background:rgba(10,13,28,.55);color:#dfe8ff;font:12px/1.4 system-ui,sans-serif;text-align:center}
    #boost.on{color:#ffd27a;font-weight:600}
    #sound{pointer-events:auto;margin-left:4px;padding:2px 10px;border:1px solid rgba(255,226,196,.5);border-radius:999px;background:rgba(255,226,196,.12);color:#fff1e2;font:600 12px/1.4 system-ui,sans-serif;cursor:pointer}
    #sound:hover{background:rgba(255,226,196,.25)}
    #sound.off{color:#ffb3a0;border-color:rgba(255,179,160,.6)}
    #clock{position:fixed;top:16px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
    .clock-text{padding:6px 14px;border-radius:999px;background:rgba(20,12,10,.55);color:#fff1e2;font:600 14px/1.3 system-ui,sans-serif;white-space:nowrap;font-variant-numeric:tabular-nums}
    .clock-bar{position:relative;width:260px;height:6px;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
    .clock-marker{position:absolute;top:-3px;width:3px;height:12px;margin-left:-1.5px;border-radius:2px;background:#fff;box-shadow:0 0 4px #fff}
    #map{position:fixed;top:16px;right:16px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
    #minimap{width:180px;height:180px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,226,196,.55),0 4px 18px rgba(40,18,8,.45)}
    #map-info{padding:4px 10px;border-radius:8px;background:rgba(40,18,8,.45);color:#ffe2c4;font:12px/1.4 system-ui,sans-serif;white-space:nowrap}
    @media (max-width:900px){#clock{top:auto;bottom:64px}.clock-text{font-size:12px}}
    @media (max-width:600px){#minimap,#skymap{width:120px;height:120px}#map-info,#sky-info{font-size:11px;max-width:150px;white-space:normal}.clock-bar{width:180px}}</style>
</head>
<body>
  <div id="clock"><div class="clock-text"></div><div class="clock-bar"><div class="clock-marker"></div></div></div>
  <div id="sky-map"><canvas id="skymap"></canvas><div id="sky-info"></div></div>
  <div id="map"><canvas id="minimap"></canvas><div id="map-info"></div></div>
  <div id="hud"><b>WASD</b> drive · <b>Q</b> 2× speed: <span id="boost">off</span> · <b>V</b> sky view · <b>T</b> mission control · <b>mouse</b> orbit camera · <b>M</b> <button id="sound" type="button" class="off">🔇 Sound: off</button></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
